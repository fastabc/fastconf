name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    name: Validate, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Validate coordinated module tags
        run: |
          bash tools/tag-release.sh "$VERSION" --dry-run > "$RUNNER_TEMP/release-tags"
          while IFS= read -r tag; do
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          done < "$RUNNER_TEMP/release-tags"
      - name: Repository checks
        run: make check
      - name: Check compatibility with v1.1.0
        run: make api-check BASE=v1.1.0
      - name: Test candidate modules
        run: make test-candidate
      - name: Build release archives
        run: make dist
      - name: Verify release checksums
        run: make dist-verify
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
