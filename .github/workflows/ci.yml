name: CI

on:
  push:
    branches: ["master"]
  pull_request: {}

env:
  GOWORK: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: module discovery
    runs-on: ubuntu-latest
    outputs:
      floors: ${{ steps.inventory.outputs.floors }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover module Go floors
        id: inventory
        run: |
          floors=$(bash tools/modules.sh matrix)
          echo "floors=$floors" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Root module — build, test (race), budget guards
  # -----------------------------------------------------------------------
  test:
    name: test / ${{ matrix.os }} / go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "1.26.x"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            go: "1.26.x"
          - os: windows-latest
            go: "1.26.x"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -mod=readonly -race -count=1 -timeout=5m ./...

      - name: BenchmarkGet guard
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: bash tools/bench-guard.sh

  vulnerabilities:
    name: vulnerabilities / v1.0.0 candidate dependencies
    needs: modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: bash tools/check-candidate.sh bash tools/check-vulnerabilities.sh

  # Test each isolated candidate at its declared Go floor. Root platforms above
  # exercise the shared core; one workspace job verifies local development.
  test-submodules:
    name: test / min go ${{ matrix.go }} / ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.floors) }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: bash tools/check-candidate.sh bash tools/modules.sh test "${{ matrix.module }}"

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: make test-workspace
      # v1 establishes the stable API; remove BASE=none after the first release.
      - run: make api-check BASE=none

  # -----------------------------------------------------------------------
  # Lint (golangci-lint) — root module only (sub-modules share the same rules)
  # -----------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --timeout=5m ./...

      - name: Go formatting (all modules)
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Standard-library-only dependencies
        shell: bash
        run: |
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/coalesce)
          test "$deps" = github.com/fastabc/fastconf/internal/coalesce
          deps=$(go -C integrations/log list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./...)
          if printf '%s\n' "$deps" | grep -v '^github.com/fastabc/fastconf/integrations/log/'; then
            echo 'integrations/log must depend only on the standard library'
            exit 1
          fi

      - name: Release tooling regression tests
        run: make check
