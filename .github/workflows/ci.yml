name: CI

on:
  push:
    branches: ["master"]
  pull_request: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: module discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      floors: ${{ steps.inventory.outputs.floors }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover module Go floors
        id: inventory
        run: |
          floors=$(bash tools/modules.sh matrix)
          echo "floors=$floors" >> "$GITHUB_OUTPUT"

  test:
    name: test / ${{ matrix.os }} / go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "1.26.x"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            go: "1.26.x"
          - os: windows-latest
            go: "1.26.x"
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"

      - name: Build
        run: make build

      - name: Test (race)
        run: make test

      - name: BenchmarkGet guard
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: make bench-guard

  vulnerabilities:
    name: vulnerabilities / candidate dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - run: bash tools/check-candidate.sh bash tools/check-vulnerabilities.sh

  # Test each isolated candidate at its declared Go floor. Root platforms above
  # exercise the shared core; one workspace job verifies local development.
  test-submodules:
    name: test / min go ${{ matrix.go }} / ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.floors) }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: Test candidate at declared Go floor
        env:
          MODULES: ${{ matrix.module }}
        run: make test-candidate

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - run: make test-workspace
      - name: Run core and optional examples
        run: make example
      # Use a candidate newer than the fixed baseline; do not compare a version
      # to itself or silently fall back to BASE=none.
      - name: Check compatibility with v1.1.0
        run: make api-check BASE=v1.1.0 VERSION=v1.2.0

  # Discover every module, including benchmarks, through the same local command.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"

      - name: Lint all modules
        run: make lint

      - name: Repository and tooling regression checks
        run: make check

      - name: Install workflow checker
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Shell and workflow checks
        run: make tools-check
